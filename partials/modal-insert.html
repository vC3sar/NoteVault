<div id="insert-modal" class="fixed inset-0 bg-black/45 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="w-[760px] max-w-[92vw] max-h-[82vh] overflow-hidden rounded-2xl border border-outline-variant/20 bg-surface-container-lowest shadow-2xl">
        <div class="px-5 py-4 border-b border-outline-variant/15 flex items-center justify-between">
            <div>
                <h4 class="text-lg font-extrabold text-on-surface tracking-tight">Insertar Elemento</h4>
                <p class="text-xs text-on-surface-variant mt-0.5">Elige una categoría y agrega bloques en la nota.</p>
            </div>
            <button id="insert-modal-close" class="p-2 rounded-lg hover:bg-surface-container-high text-on-surface-variant">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
        <div class="px-4 pt-3 pb-2 border-b border-outline-variant/10 flex gap-2 overflow-x-auto">
            <button data-insert-tab="recommended" class="insert-tab-btn bg-primary/10 text-primary border-primary/30">Recomendados</button>
            <button data-insert-tab="structure" class="insert-tab-btn">Estructura</button>
            <button data-insert-tab="lists" class="insert-tab-btn">Listas</button>
            <button data-insert-tab="blocks" class="insert-tab-btn">Bloques</button>
        </div>
        <div class="p-4 overflow-y-auto custom-scrollbar max-h-[58vh] space-y-4">
            <div data-insert-panel="recommended" class="insert-panel grid grid-cols-1 md:grid-cols-2 gap-3">
                <button data-insert-action="table-3x3" class="insert-card">
                    <i data-lucide="table-2" class="w-5 h-5 text-primary"></i>
                    <div>
                        <div class="font-bold">Tabla 3x3</div>
                        <div class="text-xs text-on-surface-variant">Ideal para comparaciones rápidas</div>
                    </div>
                </button>
                <button data-insert-action="table-4x2" class="insert-card">
                    <i data-lucide="table-properties" class="w-5 h-5 text-primary"></i>
                    <div>
                        <div class="font-bold">Tabla 4x2</div>
                        <div class="text-xs text-on-surface-variant">Encabezados + filas compactas</div>
                    </div>
                </button>
            </div>

            <div data-insert-panel="structure" class="insert-panel hidden grid grid-cols-1 md:grid-cols-2 gap-3">
                <button data-insert-action="h2" class="insert-card"><i data-lucide="heading-2" class="w-5 h-5 text-primary"></i><div><div class="font-bold">Título H2</div><div class="text-xs text-on-surface-variant">Sección principal</div></div></button>
                <button data-insert-action="h3" class="insert-card"><i data-lucide="heading-3" class="w-5 h-5 text-primary"></i><div><div class="font-bold">Título H3</div><div class="text-xs text-on-surface-variant">Subsección</div></div></button>
                <button data-insert-action="divider" class="insert-card"><i data-lucide="minus" class="w-5 h-5 text-primary"></i><div><div class="font-bold">Separador</div><div class="text-xs text-on-surface-variant">Línea horizontal</div></div></button>
            </div>

            <div data-insert-panel="lists" class="insert-panel hidden grid grid-cols-1 md:grid-cols-2 gap-3">
                <button data-insert-action="bullet-list" class="insert-card"><i data-lucide="list" class="w-5 h-5 text-primary"></i><div><div class="font-bold">Lista con viñetas</div><div class="text-xs text-on-surface-variant">Puntos rápidos</div></div></button>
                <button data-insert-action="number-list" class="insert-card"><i data-lucide="list-ordered" class="w-5 h-5 text-primary"></i><div><div class="font-bold">Lista numerada</div><div class="text-xs text-on-surface-variant">Pasos o ranking</div></div></button>
                <button data-insert-action="check-list" class="insert-card"><i data-lucide="list-checks" class="w-5 h-5 text-primary"></i><div><div class="font-bold">Checklist</div><div class="text-xs text-on-surface-variant">Tareas pendientes</div></div></button>
            </div>

            <div data-insert-panel="blocks" class="insert-panel hidden grid grid-cols-1 md:grid-cols-2 gap-3">
                <button data-insert-action="blockquote" class="insert-card"><i data-lucide="quote" class="w-5 h-5 text-primary"></i><div><div class="font-bold">Cita</div><div class="text-xs text-on-surface-variant">Bloque destacado</div></div></button>
                <button data-insert-action="code-block" class="insert-card"><i data-lucide="code-2" class="w-5 h-5 text-primary"></i><div><div class="font-bold">Bloque de código</div><div class="text-xs text-on-surface-variant">Código con fondo</div></div></button>
                <button data-insert-action="callout" class="insert-card"><i data-lucide="lightbulb" class="w-5 h-5 text-primary"></i><div><div class="font-bold">Tip / Callout</div><div class="text-xs text-on-surface-variant">Aviso visual</div></div></button>
            </div>
        </div>
    </div>
</div>
